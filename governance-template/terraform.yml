name: Governance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: python3 scripts/catalog.py
      - run: python3 scripts/test-service-factory.py
      - run: python3 -m unittest discover -s service-template/tests
      - run: terraform fmt -check -recursive platform
      - name: Validate governance roots with the locked provider
        run: |
          export TF_PLUGIN_CACHE_DIR="$RUNNER_TEMP/providers"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for directory in platform/{control-tower,scp,iam}; do
            terraform -chdir="$directory" init -input=false -backend=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
